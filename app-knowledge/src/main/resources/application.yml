server:
  port: 8082

spring:
  application:
    name: app-knowledge
  datasource:
    url: jdbc:mysql://localhost:13306/ai_workbench?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql

ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${AI_LLM_API_KEY:${GLM_API_KEY:}}
    model-name: ${AI_LLM_MODEL:glm-5.3-flash}
  # Phase 2 打开下面两项，启用向量模型与 pgvector
  embedding:
    enabled: false
  rag:
    enabled: false
