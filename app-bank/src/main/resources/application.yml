server:
  port: 8081

spring:
  application:
    name: app-bank
  datasource:
    url: jdbc:mysql://localhost:13306/ai_workbench?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 本地默认与 .env 保持一致，防止 dotenv 未加载时占位符解析失败；生产用环境变量覆盖
    password: ${MYSQL_PASSWORD:204512}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql

ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${AI_LLM_API_KEY:${GLM_API_KEY:}}
    model-name: ${AI_LLM_MODEL:glm-4.7-flash}

bank:
  # 演示登录态：当前客户账户号（Phase 2 接入登录后改为从会话中取）
  current-account-no: "62220001"
