server:
  port: 8083

spring:
  application:
    name: app-interview
  datasource:
    url: jdbc:mysql://localhost:13306/ai_workbench?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 可观测性：同 app-knowledge，无登录体系故只暴露 health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://ws-k4ybdjfu1bcadgfh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_LLM_API_KEY:${GLM_API_KEY:}}
    model-name: ${AI_LLM_MODEL:qwen3.8-flash}
