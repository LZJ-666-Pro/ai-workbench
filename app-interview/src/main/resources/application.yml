server:
  port: 8083

spring:
  application:
    name: app-interview
  datasource:
    url: jdbc:mysql://localhost:13306/ai_workbench?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 开发库由 app-bank 共享（其 V2~V11 迁移已应用到库里，但本模块 classpath 没有这些脚本）。
    # 不忽略缺失迁移的话，Flyway 校验会把「库里有、代码里没有」判为失败，本服务永远起不来。
    # 注意：本模块不建表不迁移，ignore 只放宽校验，不影响任何已有结构
    ignore-migration-patterns: "*:missing"

# 可观测性：同 app-knowledge，无登录体系故只暴露 health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://ws-k4ybdjfu1bcadgfh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_LLM_API_KEY:${GLM_API_KEY:}}
    model-name: ${AI_LLM_MODEL:qwen3.8-flash}
